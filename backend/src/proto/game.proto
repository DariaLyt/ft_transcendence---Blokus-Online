syntax = "proto3";

package game;

option go_package = "./pb";

service GameEngine {
  	rpc ValidateAndMakeMove (MoveRequest) returns (GameStateResponse);
}

message MoveRequest {
	int32 user_id = 1;
	string color = 2;
	string piece_id = 3;
	int32 origin_x = 4;
	int32 origin_y = 5;
	int32 rotation = 6;
	bool flip = 7;
}

message GameStateResponse {
	bool is_valid = 1;
	string error_message = 2;
	int32 current_turn_user_id = 3;
}