syntax = "proto3";

package game;

option go_package = "./pb";

service GameEngine {
  rpc ValidateAndMakeMove (MoveRequest) returns (GameStateResponse);
  // Lobby action: CREATE_LOBBY, JOIN_LOBBY, TOGGLE_READY, LEAVE_LOBBY,
  // BEGIN_READY_CHECK, ACCEPT_READY_CHECK, DECLINE_READY_CHECK.
  rpc HandleLobbyAction (LobbyActionRequest) returns (ActionResponse);
  // Game action: MAKE_MOVE, PASS_TURN, DISCONNECT.
  rpc HandleGameAction (GameActionRequest) returns (ActionResponse);
  rpc GetGameStateSnapshot (GameStateRequest) returns (ActionResponse);
}

message MoveRequest {
  int32 user_id = 1;
  string color = 2;
  string piece_id = 3;
  int32 origin_x = 4;
  int32 origin_y = 5;
  int32 rotation = 6;
  bool flip = 7;
}

message GameStateResponse {
  bool is_valid = 1;
  string error_message = 2;
  int32 current_turn_user_id = 3;
  string state = 4;
}

message GameStateRequest {
  int32 user_id = 1;
  string game_id = 2;
}

message ActionResponse {
  bool success = 1;
  string error_code = 2;
  string message = 3;
  string state = 4;
}

// [NEW] names/fields match Go engine. Search [OLD] below for previous Payload types.
message CreateLobby {
  int32 max_players = 1;
  string username = 2;
}

message JoinLobby { // [NEW]
  string lobby_id = 1;
  string username = 2;
}

message ToggleReady { // [NEW] was LobbyIdOnlyPayload
  string lobby_id = 1;
}

message LeaveLobby {} // [NEW] was EmptyPayload

message BeginReadyCheck { // [NEW] was LobbyIdOnlyPayload
  string lobby_id = 1;
}

message AcceptReadyCheck { // [NEW] was LobbyIdOnlyPayload
  string lobby_id = 1;
}

message DeclineReadyCheck { // [NEW] was LobbyIdOnlyPayload
  string lobby_id = 1;
}

message LobbyActionRequest {
  int32 user_id = 1;
  oneof payload {
    CreateLobby create_lobby = 2; // [NEW] was CreateLobbyPayload
    JoinLobby join_lobby = 3; // [NEW] was JoinLobbyPayload
    ToggleReady toggle_ready = 4; // [NEW] was LobbyIdOnlyPayload
    LeaveLobby leave_lobby = 5; // [NEW] was EmptyPayload
    BeginReadyCheck begin_ready_check = 6; // [NEW] was LobbyIdOnlyPayload
    AcceptReadyCheck accept_ready_check = 7; // [NEW] was LobbyIdOnlyPayload
    DeclineReadyCheck decline_ready_check = 8; // [NEW] was LobbyIdOnlyPayload
  }
}

message MakeMove { // [NEW] was MakeMovePayload
  string color = 1;
  string piece_id = 2;
  int32 origin_x = 3;
  int32 origin_y = 4;
  int32 rotation = 5;
  bool flip = 6;
}

message PassTurn { // [NEW] was PassTurnPayload
  string color = 1;
}

message Disconnect {} // [NEW] was DisconnectPayload

message GameActionRequest {
  int32 user_id = 1;
  oneof payload {
    MakeMove make_move = 2; // [NEW] was MakeMovePayload
    PassTurn pass_turn = 3; // [NEW] was PassTurnPayload
    Disconnect disconnect = 4; // [NEW] was DisconnectPayload
  }
}

