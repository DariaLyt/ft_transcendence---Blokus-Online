syntax = "proto3";

package game;

option go_package = "./pb";

service GameEngine {
  	rpc ValidateAndMakeMove (MoveRequest) returns (GameStateResponse);
}

message MoveRequest {
	int32 user_id = 1;
	int32 piece_id = 2;
	int32 origin_x = 3;
	int32 origin_y = 4;
	int32 rotation = 5;
	bool flip = 6;
}

message GameStateResponse {
	bool is_valid = 1;
	string error_message = 2;
	int32 current_turn_user_id = 3;
}